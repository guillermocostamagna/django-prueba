{% extends 'principal/base.html' %}

{% block content %}
    <h1>Productos: Categorías</h1>
    <form method = "get">
        <input type="text" name="busqueda" placeholder="Busqueda por nombre">
    </form>
    <br>
    <a href="{% url 'producto:categoria_create' %}"><button>Crear Categoria</button></a>
        
    <table>
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        {% for categoria in object_list %}
            <tr>
                <td>{{ categoria.nombre }}</td>
                <td>
                    <a href="{% url 'producto:categoria_update' categoria.id %}"><button>Editar</button></a>
                </td>
                <td>
                    <a href="{% url 'producto:categoria_delete' categoria.id %}"><button>Eliminar</button></a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td>No hay categorias</td>
            </tr>
        {% endfor %}
    </table>
    <a href="{% url 'producto:index' %}">Volver</a>
{% endblock content %}
