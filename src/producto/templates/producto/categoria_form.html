{% extends 'principal/base.html' %}

{% block content %}
    {% if form.instance.pk %}
        <h1>Producto: Categorias - Formulario de Edición</h1>
    {% else %}
        <h1>Producto: Categorias - Formulario de Creación</h1>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Guardar</button>
    </form>
    <a href="{% url 'producto:index' %}"></a>
{% endblock content %}
